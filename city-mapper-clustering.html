<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Mapper + Events + GPX</title>

  <!-- Google Maps -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCqdR-DJBX5mCsaw2yHbrLZqbeFZCW9jto&callback=initMapApp"
    async defer></script>

  <!-- MarkerClusterer -->
  <script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.min.js"></script>

  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; }
    #map { height: 85vh; width: 100%; }
    #controls {
      padding: 10px;
      background: #f9f9f9;
      border-bottom: 1px solid #ddd;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    #filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 6px 12px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #005fcc; }
  </style>
</head>
<body>

<div id="controls">
  <label>📍 CSV:
    <input type="file" id="csvFile" accept=".csv" />
  </label>
  <button id="loadCsvBtn">Load CSV</button>

  <label>🚴 GPX:
    <input type="file" id="gpxFile" accept=".gpx" multiple />
  </label>
  <button id="loadGpxBtn">Load GPX</button>

  <span id="status"></span>
</div>

<div id="filters"></div>
<div id="map"></div>

<script>
let map, geocoder;
let allMarkers = [];
let clusterManager;
let eventTypes = new Set();
let eventColors = {};
let activeEventFilters = new Set();

const colorPalette = [
  "red", "blue", "green", "purple", "orange", "pink", "yellow"
];

function initMapApp() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 20, lng: 0 },
    zoom: 2
  });
  geocoder = new google.maps.Geocoder();
}

// === CSV LOAD ===
document.getElementById("loadCsvBtn").addEventListener("click", () => {
  const file = document.getElementById("csvFile").files[0];
  if (!file) return alert("Select a CSV file.");

  if (clusterManager) clusterManager.clearMarkers();
  allMarkers = [];
  eventTypes.clear();
  eventColors = {};
  activeEventFilters.clear();

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: async ({ data }) => {
      let count = 0;
      for (const row of data) {
        const address = row["Address"] || "";
        const city = row["City"] || "";
        const zip = row["Zip Code"] || "";
        const country = row["Country"] || "";
        const rawEvent = row["Event Type"];
        const eventType = rawEvent !== undefined && rawEvent !== null
          ? String(rawEvent).trim()
          : "Other";

        eventTypes.add(eventType);

        const fullAddress = `${address}, ${city}, ${zip}, ${country}`;
        await geocodeAddress(fullAddress, eventType);
        count++;
        document.getElementById("status").innerText = `Geocoded ${count}/${data.length}`;
      }

      setupEventFilters();
      refreshMarkers();
      document.getElementById("status").innerText += " ✅";
    }
  });
});

async function geocodeAddress(address, eventType) {
  return new Promise(resolve => {
    geocoder.geocode({ address }, (results, status) => {
      if (status === "OK") {
        const loc = results[0].geometry.location;
        const marker = createEventMarker(loc, address, eventType);
        allMarkers.push(marker);
      }
      resolve();
    });
  });
}

function createEventMarker(location, label, eventType) {
  if (!eventColors[eventType]) {
    eventColors[eventType] = colorPalette[Object.keys(eventColors).length % colorPalette.length];
  }

  const marker = new google.maps.Marker({
    position: location,
    title: label,
    icon: `https://maps.google.com/mapfiles/ms/icons/${eventColors[eventType]}-dot.png`
  });

  marker.eventType = eventType;

  const info = new google.maps.InfoWindow({
    content: `<strong>${label}</strong><br>Event: ${eventType}`
  });

  marker.addListener("click", () => info.open(map, marker));
  return marker;
}

// === FILTER UI ===
function setupEventFilters() {
  const filtersDiv = document.getElementById("filters");
  filtersDiv.innerHTML = "<strong>Filter events:</strong> ";

  eventTypes.forEach(type => {
    activeEventFilters.add(type);

    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = true;
    cb.onchange = () => {
      cb.checked ? activeEventFilters.add(type) : activeEventFilters.delete(type);
      refreshMarkers();
    };
    label.append(cb, ` ${type}`);
    filtersDiv.appendChild(label);
  });
}

// === MARKER REFRESH ===
function refreshMarkers() {
  if (clusterManager) clusterManager.clearMarkers();

  const visible = allMarkers.filter(m => activeEventFilters.has(m.eventType));
  clusterManager = new markerClusterer.MarkerClusterer({ map, markers: visible });
}

// === GPX LOAD (unchanged) ===
document.getElementById("loadGpxBtn").addEventListener("click", () => {
  const files = document.getElementById("gpxFile").files;
  for (const file of files) {
    const reader = new FileReader();
    reader.onload = e => {
      const xml = new DOMParser().parseFromString(e.target.result, "text/xml");
      const points = [...xml.getElementsByTagName("trkpt")].map(p => ({
        lat: parseFloat(p.getAttribute("lat")),
        lng: parseFloat(p.getAttribute("lon"))
      }));

      const polyline = new google.maps.Polyline({
        path: points,
        strokeColor: "#000",
        strokeWeight: 3,
        map
      });

      const bounds = new google.maps.LatLngBounds();
      points.forEach(p => bounds.extend(p));
      map.fitBounds(bounds);
    };
    reader.readAsText(file);
  }
});
</script>

</body>
</html>
